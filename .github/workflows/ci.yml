name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint-format-vet:
    name: Lint, Format & Vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source snapshots and generated schemas
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/spec_snapshot.py --check
          python3 scripts/schema_models.py modelsecurity redteam gateway agentguard parity --check
          python3 scripts/check_typescript_parity.py
          python3 scripts/parity_fixtures.py --check
      - name: Compile integration tests without live calls
        run: go test -race -tags=integration -run '^$' ./...
      - name: Lint integration tests
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --build-tags integration ./...
