name: Deploy Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'aisec/**'
      - 'scripts/generate_api_reference.go'
      - 'scripts/check_doc_examples.py'
      - 'go.mod'
      - '.github/workflows/deploy-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'aisec/**'
      - 'scripts/generate_api_reference.go'
      - 'scripts/check_doc_examples.py'
      - 'go.mod'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npx playwright install --with-deps chromium
        working-directory: docs-site
      - run: npm run check
        working-directory: docs-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-browser-evidence
          path: docs-site/test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-public-site:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npx playwright install --with-deps chromium
        working-directory: docs-site
      - run: npm run test:browser
        working-directory: docs-site
        env:
          DOCS_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: published-documentation-browser-evidence
          path: docs-site/test-results/
          retention-days: 14
